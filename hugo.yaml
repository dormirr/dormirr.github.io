baseURL: "https://dormirr.github.io/"
title: 张天赐的小世界
copyright: "本博客的作品采用 [知识共享署名-非商业性使用-相同方式共享 4.0 国际许可协议](https://creativecommons.org/licenses/by-nc-sa/4.0/) 进行许可"
theme: ["PaperMod"]

# Hugo 配置
caches: # 缓存
  images:
    dir: :cacheDir/images
enableEmoji: true # Markdown 中使用 emoji
enableRobotsTXT: true # 生成 robots.txt 文件
hasCJKLanguage: true # 自动检测内容中的 CJK 语言，影响字数统计
languageCode: zh-cn # 使用语言
defaultContentLanguage: zh # 默认语言
timeZone: Asia/Shanghai # 时区
markup: # Markdown 渲染
  goldmark:
    renderer:
      unsafe: true # 渲染 Markdown 中混合的原始 HTML
  highlight: # Code 高亮
    guessSyntax: true # 未指定语言时自动检测
    noClasses: false # 使用外部 CSS
    style: monokailight # 语法高亮样式
menus: # 导航
  main:
    - name: 首页
      pageRef: /
      weight: 10
    - name: 文章
      pageRef: /posts
      weight: 20
    - name: 归档
      pageRef: /archives
      weight: 30
    - name: 分类
      pageRef: /categories
      weight: 40
    - name: 标签
      pageRef: /tags
      weight: 50
    - name: 搜索
      pageRef: /search
      weight: 60
    - name: 关于
      pageRef: /about
      weight: 70
taxonomies: # 分类
  category: categories
  tag: tags
  series: series
minify: # 压缩
  disableXML: true
outputs: # 生成文件
  home:
    - HTML
    - RSS
    - JSON
pagination: # 分页
  disableAliases: false
  pagerSize: 5
# 网站主要部分
mainsections: ["posts"]
params: # 自定义参数
  env: production
  title: 张天赐的小世界
  defaultTheme: auto # 主题颜色
  description: "张天赐的小世界，记录个人的学习与生活历程。"
  author: 张天赐
  keywords: [张天赐, Java, 系统架构]
  DateFormat: 2006-01-02
  homeInfoParams: # 主页信息
    Title: "张天赐的小世界"
    Content: >
      👋 欢迎访问我的博客，我是一名 2020 年毕业的后端研发工程师，目前在北京工作，就职于京东。

      - 工作中主要负责支付营销工具的开发与稳定性保障。在这期间，支撑过若干次 618、1111 大促，以及春晚亿级流量营销，有较为丰富的亿级流量高并发系统设计与实战经验。相信大家在京东购物时一定都用过我负责的系统服务。

      - 平时爱好读书与思考，研究一些让我好奇的东西。偶尔会玩玩尤克里里与 Nintendo Switch，享受一个人的平静生活。

  socialIcons: # 社交图标
    - name: github
      title: 我的 GitHub
      url: "https://github.com/dormirr"

  editPost: # 编辑文章
    URL: "https://github.com/dormirr/dormirr.github.io/tree/main/content"
    Text: "提出修改建议"
    appendFilePath: true # 将文件路径附加到编辑链接上


  ShowShareButtons: true # 共享按钮
  ShowReadingTime: true # 显示阅读时间
  ShowToc: true # 显示目录
  tocopen: true # 展开目录
  ShowBreadCrumbs: true # 添加痕迹导航
  ShowPostNavLinks: true # 添加上一个/下一个页面建议
  ShowCodeCopyButtons: true # 复制代码
  ShowWordCount: true # 显示字数
  ShowRssButtonInSectionTermList: true # 页面展示 RSS 图标
  displayFullLangName: true # 显示语言名称
  # comments: true # 开启评论

  ShowAllPagesInArchive: true
  ShowPageNums: true #
  images: ["images/papermod-cover.png"]
