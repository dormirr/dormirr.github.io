baseURL: https://www.zhangtianci.cn/
title: 张天赐的小世界
copyright: 本博客的作品采用 [知识共享署名-非商业性使用-相同方式共享 4.0 国际许可协议](https://creativecommons.org/licenses/by-nc-sa/4.0/) 进行许可
theme:
  - PaperMod
hasCJKLanguage: true # 自动检测内容中的 CJK 语言，影响字数统计
languageCode: zh-cn # 使用语言
defaultContentLanguage: zh # 默认语言
timeZone: Asia/Shanghai # 时区
enableEmoji: true # Markdown 中使用 emoji
enableRobotsTXT: true # 生成 robots.txt 文件
# 网站主要部分
mainsections: ["posts"]
pagination: # 分页
  disableAliases: false
  pagerSize: 5
markup: # Markdown 渲染
  goldmark:
    renderer:
      unsafe: true # 渲染 Markdown 中混合的原始 HTML
  highlight: # Code 高亮
    guessSyntax: true # 未指定语言时自动检测
    noClasses: false # 使用外部 CSS
    style: monokailight # 语法高亮样式
outputs: # 生成文件
  home:
    - HTML
    - RSS
    - JSON
minify: # 压缩
  disableXML: true
enableInlineShortcodes: true # shortcode，类似于模板变量，可以在写 markdown 的时候便捷地插入，官方文档中有一个视频讲的很通俗
pygmentsUseClasses: true
caches: # 缓存
  images:
    dir: :cacheDir/images
taxonomies: # 分类
  category: categories
  tag: tags
  series: series
services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
menus: # 导航
  main:
    - name: 首页
      title: 首页
      pageRef: /
      weight: 10
    - name: 文章
      title: 文章
      pageRef: /posts
      weight: 20
    - name: 归档
      title: 归档
      pageRef: /archives
      weight: 30
    - name: 分类
      title: 分类
      pageRef: /categories
      weight: 40
    - name: 标签
      title: 标签
      pageRef: /tags
      weight: 50
    - name: 搜索
      title: 搜索
      pageRef: /search
      weight: 60
    - name: 关于
      title: 关于
      pageRef: /about
      weight: 70
params: # 自定义参数
  env: production
  title: 张天赐的小世界
  defaultTheme: auto # 主题颜色
  description: 张天赐的小世界，记录个人的学习与生活历程。
  author: 张天赐
  keywords: [张天赐, Java, 系统架构]
  DateFormat: 2006-01-02
  homeInfoParams: # 主页信息
    Title: 张天赐的小世界
    Content: 👋 欢迎来到我的精神角落，愿我们在这个喧嚣世界里，始终保有孩童般的好奇与热忱。
  socialIcons: # 社交图标
    - name: github
      title: 我的 GitHub
      url: https://github.com/dormirr
  assets: # Logo
    disableHLJS: true
    favicon: Logo.jpg
    favicon16x16: Logo.jpg
    favicon32x32: Logo.jpg
    apple_touch_icon: Logo.jpg
    safari_pinned_tab: Logo.jpg
  ShowShareButtons: true # 共享按钮
  ShowReadingTime: true # 显示阅读时间
  ShowToc: true # 显示目录
  tocopen: true # 展开目录
  ShowBreadCrumbs: true # 添加痕迹导航
  ShowPostNavLinks: true # 添加上一个/下一个页面建议
  ShowCodeCopyButtons: true # 复制代码
  ShowWordCount: true # 显示字数
  ShowRssButtonInSectionTermList: true # 页面展示 RSS 图标
  ShowFullTextinRSS: true # RSS 输出全文
  ShowAllPagesInArchive: true # 归档页展示所有文章
  ShowPageNums: true # 展示页数
  displayFullLangName: true # 显示语言名称
  fuseOpts: # 搜索
    isCaseSensitive: false # 是否大小写敏感
    shouldSort: true # 是否包含匹配项
    location: 0 # 是否排序
    distance: 1000
    threshold: 0.4 # 0.0 完全匹配
    minMatchCharLength: 0
    keys: [ "title", "permalink", "summary", "content" ]
  comments: true # 开启评论
  giscus: # 评论配置
    repo: dormirr/dormirr.github.io
    repoId: R_kgDOOi7Wvg
    category: Announcements
    categoryId: DIC_kwDOOi7Wvs4CpyvJ
    mapping: pathname
    strict: 0
    reactionsEnabled: 1
    emitMetadata: 0
    inputPosition: bottom
    lightTheme: light
    darkTheme: dark
    lang: zh-CN
    crossorigin: anonymous
  editPost: # 编辑文章
    URL: https://github.com/dormirr/dormirr.github.io/tree/main/content
    Text: 提出修改建议
    appendFilePath: true # 将文件路径附加到编辑链接上